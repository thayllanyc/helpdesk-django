{% extends "chamados/base.html" %}

{% block title %}Gerenciar Chamado #{{ chamado.id }}{% endblock %}

{% block content %}
    <h1>Gerenciar #{{ chamado.id }} - {{ chamado.titulo }}</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
    </div>
{% endblock %}
