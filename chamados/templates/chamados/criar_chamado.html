{% extends "chamados/base.html" %}

{% block title %}Novo Chamado{% endblock %}

{% block content %}
    <h1>Abrir novo chamado</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>
{% endblock %}
